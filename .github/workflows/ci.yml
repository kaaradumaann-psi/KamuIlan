name: CI

on:
  push:
    branches: [main, arena/*]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Kapsam raporu (senkron, ağ erişimsiz)
        run: npm run sources:report -- --json
      - name: Playwright tarayıcıları
        run: npx playwright install --with-deps chromium
      - name: Uçtan uca testler
        run: npm run test:e2e -- --project=chromium
        env:
          E2E_BASE_URL: http://localhost:4173
