name: CI

on:
  push:
    branches: [main, arena/*]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # CI'da hiçbir gerçek kaynağa istek atılmaz; testler sahte adaptör/fetcher kullanır.
      SOURCE_LIVE_FETCH: '0'
      SOURCE_BROWSER_FALLBACK: '0'
      SOURCE_TLS_AIA_COMPLETION: '0'
      SCHEDULER_ENABLED: '0'
      AI_ASSISTANT_ENABLED: '0'
      LLM_CLASSIFIER_ENABLED: '0'
      EMAIL_PROVIDER: file
      EMAIL_DEV_FILE_TRANSPORT: '1'
      DATABASE_DRIVER: file
      NODE_ENV: test
      DATA_DIR: ./.ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: İzole test imza anahtarı üret
        run: |
          app_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$app_secret"
          echo "APP_SECRET=$app_secret" >> "$GITHUB_ENV"
      - name: Çevrimdışı doğrulama (izole DB/ağ/provider/posta)
        run: npm run verify:all

      - name: Offline verification raporları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-verification-report
          path: |
            artifacts/verify-all/*/report.json
            artifacts/verify-all/*/source-inventory.json
            artifacts/verify-all/*/classification-evaluation.json
            artifacts/verify-all/*/llm-doctor-offline.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Kapsam raporu (salt-okunur statik JSON)
        run: npm run sources:report -- --static --json > coverage-report.json

      # --- Uçtan uca (tarayıcı) testler -------------------------------------
      # Sabit/sample kimlik bilgisi kullanma; her iş için tek kullanımlık giriş üret.
      - name: İzole E2E yönetici kimlik bilgileri üret
        run: |
          admin_email="e2e-$(openssl rand -hex 8)@kamuilan.test"
          admin_password="A$(openssl rand -hex 24)Z9"
          echo "::add-mask::$admin_password"
          {
            echo "ADMIN_EMAIL=$admin_email"
            echo "ADMIN_PASSWORD=$admin_password"
          } >> "$GITHUB_ENV"

      # API tek başına worker gibi kaynak envanterini seed etmez. Sadece statik
      # tanımları file-backed test deposuna yaz; worker/planlayıcı başlatma.
      - name: E2E statik kaynak envanteri
        run: npm run seed:e2e-sources

      # Hesap yalnızca bu işin geçici DATA_DIR'inde yaşar.
      - name: E2E yönetici hesabı
        run: npm run seed:admin

      # API + derlenmiş arayüz başlatılır; Playwright bu adrese karşı koşar.
      - name: API ve arayüzü başlat
        env:
          SCHEDULER_ENABLED: '0'
          EMAIL_PROVIDER: file
          EMAIL_DEV_FILE_TRANSPORT: '1'
          # E2E navigates many proxied endpoints from one runner IP.
          RATE_LIMIT_MAX_REQUESTS: '1000'
          AUTH_RATE_LIMIT_MAX_REQUESTS: '1000'
        run: |
          npm run start > api.log 2>&1 &
          npm run preview > web.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:3000/api/health >/dev/null && break
            sleep 1
          done
          for i in $(seq 1 40); do
            curl -sf http://localhost:4173 >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/health >/dev/null || { echo 'API başlamadı'; cat api.log; exit 1; }
          curl -sf http://localhost:4173 >/dev/null || { echo 'Arayüz başlamadı'; cat web.log; exit 1; }

      - name: Playwright tarayıcıları
        run: npx playwright install --with-deps chromium

      - name: Uçtan uca testler
        run: npm run test:e2e -- --project=chromium
        env:
          E2E_BASE_URL: http://localhost:4173

      - name: Playwright raporu (başarısız olsa da yüklenir)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Hata durumunda günlükler
        if: failure()
        run: |
          echo '--- api.log ---'; tail -n 200 api.log || true
          echo '--- web.log ---'; tail -n 100 web.log || true
