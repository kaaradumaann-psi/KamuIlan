# Kamuİlan üretim arayüzü: statik dosyalar + /api proxy'si.
#
# Tarayıcı yalnızca göreli /api yollarını çağırır; proxy hedefi API_ORIGIN
# ortam değişkeninden gelir. Bu dosya /etc/nginx/templates/default.conf.template
# olarak kopyalanır; nginx resmi imajının giriş betiği ${API_ORIGIN} yer tutucusunu
# çalışma anında doldurur (öntanımlı: http://api:3000).

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Sıkıştırma
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Derlenmiş varlıklar içerik damgası taşır; uzun önbellek güvenli.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # API proxy'si
  location /api/ {
    proxy_pass ${API_ORIGIN};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # SPA: bilinmeyen yollar arayüze düşer (derin bağlantılar çalışsın).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Güvenlik başlıkları (API kendi başlıklarını ayrıca gönderir).
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
}
