services:
  # ---------------------------------------------------------------------------
  # KamuRadar — tek komutla geliştirme ortamı
  #
  #   cd infra/docker && docker compose up --build
  #
  #   Arayüz        http://localhost:5173
  #   API           http://localhost:3000/api/health
  #   API dokümanı  http://localhost:3000/api/docs
  #   Posta kutusu  http://localhost:1080   (mailpit; gerçek e-posta gönderilmez)
  #   MongoDB       mongodb://localhost:27017
  #   Redis         redis://localhost:6379
  #
  # Üretimde bu dosya KULLANILMAZ: gerçek SMTP, yönetimli MongoDB/Redis ve
  # sır yönetimi gerekir (bkz. docs/deployment.md).
  # ---------------------------------------------------------------------------

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: kamuradar
    volumes:
      - mongo-data:/data/db
      - ../mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'no']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # Geliştirme posta sunucusu: gelen postaları yakalar, gerçek gönderim yapmaz.
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '1080:8025'
    environment:
      MP_MAX_MESSAGES: 200
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    command: ['npx', 'tsx', 'src/server/main.ts']
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      APP_BASE_URL: http://localhost:5173
      APP_SECRET: ${APP_SECRET:-gelistirme-ortami-icin-gecici-bir-anahtar-32+}
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: kamuradar
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mail
      SMTP_PORT: 1025
      EMAIL_FROM: KamuRadar <bildirim@kamuradar.local>
      SOURCE_LIVE_FETCH: ${SOURCE_LIVE_FETCH:-1}
      # Canlı kaynaklara istek atılmasın isteniyorsa: SOURCE_LIVE_FETCH=0
    ports:
      - '3000:3000'
    # Sağlık denetimi: arayüz ancak API ayakta olduğunda başlar; `docker compose ps`
    # tek bakışta gerçek durumu gösterir. Node 22'de fetch yerleşiktir (ek araç yok).
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    command: ['npx', 'tsx', 'src/worker/main.ts']
    environment:
      NODE_ENV: development
      APP_BASE_URL: http://localhost:5173
      APP_SECRET: ${APP_SECRET:-gelistirme-ortami-icin-gecici-bir-anahtar-32+}
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: kamuradar
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mail
      SMTP_PORT: 1025
      EMAIL_FROM: KamuRadar <bildirim@kamuradar.local>
      SOURCE_LIVE_FETCH: ${SOURCE_LIVE_FETCH:-1}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Geliştirme arayüzü: Vite dev sunucusu. /api isteklerini API konteynerine
  # proxy'ler (tarayıcı göreli /api çağırır; localhost'a istek atmaz).
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    command: ['npx', 'vite', '--host', '0.0.0.0', '--port', '5173']
    environment:
      API_ORIGIN: http://api:3000
    ports:
      - '5173:5173'
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
  redis-data:
